# ── Projects (copy a block to add a new one) ──
projects:
  - name: GitOps URL Shortener
    description: >-
      Serverless URL shortener on Cloudflare Workers and KV, with all infrastructure
      and links managed in Terraform. Pull requests show a formatted plan summary;
      merging applies the changes and runs a smoke test.
    tags: [Terraform, Cloudflare Workers, HCP Terraform, GitHub Actions]
    demo: https://go.britideepa.workers.dev
    demo_label: Live demo
    code: https://github.com/britideepabrahma/url-shortener

  - name: Uptime Monitor
    description: >-
      Serverless uptime monitoring with GitHub Actions: scheduled health checks,
      automatic incident tracking via GitHub Issues, and a live status page with
      uptime and response-time history.
    tags: [Python, GitHub Actions, GitHub Pages, Chart.js]
    demo: https://britideepabrahma.github.io/uptime-monitor/
    demo_label: Status page
    code: https://github.com/britideepabrahma/uptime-monitor

  - name: DevOps Status Dashboard
    description: >-
      Containerized dashboard showing Docker container health, host metrics, and CI
      pipeline runs. Every commit is linted, built, smoke-tested, and published as a
      live status page.
    tags: [Python, Flask, Docker Compose, Prometheus]
    demo: https://britideepabrahma.github.io/devops-dashboard/
    demo_label: Live demo
    code: https://github.com/britideepabrahma/devops-dashboard

